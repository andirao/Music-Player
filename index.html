<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <title>Music</title>
  </head>
  <body class="bg-red-500">
    <div
      class="container mx-auto mb-20 w-11/12 flex flex-col md:flex-row gap-6"
    >
      <!--Music Player-->
      <div
        class="bg-red-300 mx-auto mt-20 w-100 h-160 rounded-[2vw] shadow-red-200/30 shadow-xl ring-6 ring-red-100/10"
      >
        <div class="music-player">
          <nav class="flex m-4 p-5 text-white">
            <div
              class="circle bg-red-200 text-red-300 w-10 h-10 p-2 rounded-full shadow-red-400 shadow-lg hover:bg-red-500"
            >
              <i data-feather="arrow-left"></i>
            </div>
            <div
              class="circle ml-auto bg-red-200 text-red-300 w-10 h-10 p-2 rounded-full shadow-red-400 shadow-lg hover:bg-red-500"
            >
              <i data-feather="menu"></i>
            </div>
          </nav>
          <img
            class="song-img w-50 h-50 mx-auto my-10 rounded-full ring-6 ring-red-100 shadow-red-400 shadow-lg"
            src="media/chester.png"
            alt="chester"
          />
          <h1 class="text-center text-2xl font-bold">Crawling</h1>
          <p class="text-center text-md">Linkin Park</p>
          <audio controls class="mx-auto hidden" id="song">
            <source
              src="media/LinkinPark_-_Crawling_(mp3.pm).mp3"
              type="audio/mpeg"
            />
          </audio>
          <input
            class="ml-15 w-69 h-2 mt-10 rounded-lg cursor-pointer appearance-none bg-red-400 accent-red-600 focus:outline-none ring-2 ring-white"
            type="range"
            value="0"
            id="progress"
          />
          <div id="time" class="ml-15 mb-5">0:00</div>
          <div class="controls flex justify-center gap-7 cursor-pointer">
            <div
              id="rewind"
              class="bg-red-200 text-red-300 w-13 h-13 px-3 py-3 mt-2 rounded-full shadow-red-400 shadow-lg hover:bg-red-500"
            >
              <i data-feather="rewind"></i>
            </div>
            <div
              id="ctrlIcon"
              class="bg-red-400 text-red-200 w-17 h-17 px-6 py-5 rounded-full shadow-red-400 shadow-lg hover:bg-red-500"
              onclick="playPause()"
            ></div>
            <div
              id="fastForward"
              class="bg-red-200 text-red-300 w-13 h-13 px-4 py-3 mt-2 rounded-full shadow-red-400 shadow-lg hover:bg-red-500"
            >
              <i data-feather="fast-forward"></i>
            </div>
          </div>
        </div>
      </div>
      <!--Lyrics-->
      <div
        class="bg-red-300 mx-auto mt-20 w-100 h-160 rounded-[2vw] shadow-red-200/30 shadow-xl ring-6 ring-red-100/10 flex flex-col p-4"
      >
        <h2 class="text-xl font-bold text-center my-4">Lyrics</h2>
        <div
          id="lyricsContainer"
          class="overflow-y-auto break-words whitespace-normal space-y-2 max-h-[35rem] px-2 py-2 scroll-smooth"
        ></div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
